name: GPU Workload
on: [push]

jobs:
  gpu-task:
    # Use the appropriate GitHub-hosted or machine.dev specific runner label
    runs-on: machine/gpu=A10,cpu=24,ram=256,tenancy=spot,regions=us-east-1,disk=500,architecture=x64,id=${{ github.run_id }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify GPU Availability
        run: |
          nvidia-smi
